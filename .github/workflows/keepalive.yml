# Render 무료 플랜은 15분 동안 요청이 없으면 잠들고, 깨어날 때 첫 요청이 50초쯤 걸린다.
# 10분마다 /health를 불러 깨어 있게 한다. GitHub 예약 실행은 몇 분씩 늦을 수 있으니
# 심사·시연 직전에는 직접 /health를 한 번 열어 확인할 것.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://findme-api-rxg3.onrender.com/health
