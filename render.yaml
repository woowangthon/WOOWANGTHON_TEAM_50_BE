services:
  - type: web
    name: findme-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CONTENT_REVIEWED_ONLY   # 검수한 카드(reviewed: true)만 노출. 검수 0장이면 서버가 뜨지 않음
        value: "true"
      - key: GEMINI_API_KEY        # 없으면 리포트는 점수 기반 문장만 쓴다
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
